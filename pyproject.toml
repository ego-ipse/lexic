[project]
name = "lexic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mika", email = "teihenrique@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "lark>=1.3.1",
    "pydantic>=2.13.2",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexic"]

[dependency-groups]
dev = [
    "hypothesis>=6.152.1",
    "isort>=8.0.1",
    "pre-commit>=4.5.1",
    "pydeps>=3.0.6",
    "pylint>=4.0.5",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.14"

[tool.isort]
profile = "black"

[tool.pylint.design]
max-parents = 15
