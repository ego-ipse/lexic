[project]
name = "lexic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mika", email = "teihenrique@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lark>=1.3.1",
    "pydantic>=2.13.2",
    "pyparsing>=3.3.2",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexic"]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.12"
