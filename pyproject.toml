[project]
name = "lexic"
version = "0.1.0"
description = "A grammar-centric framework."
readme = "README.md"
authors = [
    { name = "Mika", email = "teihenrique@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexic"]

[dependency-groups]
dev = [
    "hypothesis>=6.152.1",
    "ruff>=0.15.12",
    "isort>=8.0.1",
    "lark>=1.3.1",
    "antlr4-tools>=0.2.1",
    "antlr4-python3-runtime>=4.13.2",
    "parsimonious>=0.10.0",
    "pyparsing>=3.2.0",
    "pre-commit>=4.5.1",
    "pydeps>=3.0.6",
    "pylint>=4.0.5",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-xdist>=3.8.0",
    "tokenizers>=0.23.1",
    "huggingface-hub>=0.36",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
markers = ["performance: timing/scaling benchmarks for parsing_2"]

[tool.pyright]
pythonVersion = "3.14"

[tool.isort]
profile = "black"

[tool.pylint.main]
# Teach astroid PEP 681 dataclass_transform field inference (Field specifier on
# IrNamedTuple/IrCachingTuple). Root-fix so no inline disables are needed at the
# field read sites. See tools/pylint_lexic.py.
init-hook = "import sys; sys.path.insert(0, 'tools')"
load-plugins = ["pylint_lexic"]

[tool.pylint.design]
max-parents = 15

[tool.pylint.basic]
# Preserve pylint's default good-names and allow the mixed-case singleton
# values that mirror Python's own (e.g. IrNone, like None). Root-fix so no
# inline `# pylint: disable=invalid-name` is needed at the definition sites.
good-names = ["i", "j", "k", "ex", "Run", "_", "IrNone"]
