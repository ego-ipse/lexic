name: performance regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/performance.yml"
      - "pyproject.toml"
      - "resources/**"
      - "src/**"
      - "tools/benchmark/**"
      - "uv.lock"
  pull_request:
    # No `branches:` filter. That filter is on the PR's TARGET, so a branch
    # opened against another branch — the working pattern here, each branch
    # judged against the green head it will merge into — produced no
    # performance read at all. Against a distant `main` a dozen commits of
    # small moves pile into `unresolved` and a real 1% is invisible.
    paths:
      - ".github/workflows/performance.yml"
      - "pyproject.toml"
      - "resources/**"
      - "src/**"
      - "tools/benchmark/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roster:
    name: Read the roster
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      grammars: ${{ steps.names.outputs.grammars }}
    steps:
      - name: Check out HEAD
        uses: actions/checkout@v7.0.1

      - name: Install Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14t"

      - name: Install the locked development environment
        run: uv sync --locked --group dev

      - name: List the roster's grammars
        id: names
        shell: bash
        run: |
          # The matrix IS the roster: one job per `Bench` in
          # tools/benchmark/cases/grammars.py, read at run time so a row added
          # there runs here without anyone editing this file.
          names="$(uv run python -c 'import json; from tools.benchmark.cases.grammars import BENCHES; print(json.dumps([b.name for b in BENCHES]))')"
          echo "grammars=$names" >> "$GITHUB_OUTPUT"
          echo "$names"

  lexic:
    name: Same-run Lexic A/B (${{ matrix.grammar }})
    needs: roster
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHON_GIL: "0"
      LEXIC_REQUIRE_FREE_THREADED: "1"
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.roster.outputs.grammars) }}
    steps:
      - name: Check out HEAD
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          path: head

      - name: Resolve the comparison base
        id: base
        working-directory: head
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # The target's head AS IT IS NOW. `pull_request.base.sha` is a
            # snapshot taken when the event fired: if the target moves after
            # that, the base is a commit the target no longer points at and
            # the delta is measured against history rather than against the
            # thing this branch will actually merge into.
            git fetch --no-tags --depth=1 origin \
              "${{ github.event.pull_request.base.ref }}"
            sha="$(git rev-parse FETCH_HEAD)"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            sha="${{ github.event.before }}"
            if [[ "$sha" =~ ^0+$ ]]; then
              sha="$(git rev-parse HEAD^)"
            fi
          else
            sha="$(git rev-parse HEAD^)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out base
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base

      - name: Install free-threaded Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14t"

      - name: Install the locked development environment
        working-directory: head
        run: uv sync --locked --group dev

      - name: Require the free-threaded witness
        working-directory: head
        run: |
          uv run python -c "
          import sys
          assert not sys._is_gil_enabled(), 'performance workflow requires PYTHON_GIL=0'
          print('python:', sys.version.split()[0], 'gil enabled:', sys._is_gil_enabled())
          "

      - name: Install the corrected protocol into the base measurement copy
        working-directory: head
        run: |
          uv run python -m tools.benchmark.measurement.copy ../base

      - name: Compare base and HEAD on this runner
        working-directory: head
        run: |
          uv run python -u -m tools.benchmark.compare \
            --base-root ../base \
            --head-root . \
            --only ${{ matrix.grammar }} \
            --json ../ab-${{ matrix.grammar }}.json

      - name: Upload this grammar's result
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ab-${{ matrix.grammar }}
          path: ab-${{ matrix.grammar }}.json
          if-no-files-found: error

  aggregate:
    name: Aggregate results
    needs: [roster, lexic]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `actions: read` is what lets this job LIST the run's artifacts. The
    # runner's own artifact service needs no such grant, which is why
    # `download-artifact` never asked for one — and why it cannot tell two
    # artifacts of the same name apart. Read-only, and only this job has it.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the aggregator
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: tools
          sparse-checkout-cone-mode: false

      - name: Download the NEWEST result per row
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # `download-artifact` with `merge-multiple` resolved a duplicated
          # name to the OLDER artifact, so a re-run's fresh reading was
          # uploaded and never read — re-running a failed row could not clear
          # it. On run 35027232682 that had the gate fail twice calling
          # dense-earley/lexic-mt `slower` at 1.0177 while the re-run it
          # ignored had measured the same row `faster` at 0.7713.
          mkdir -p results
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | [.name, .created_at, (.id|tostring)] | @tsv' \
          | sort -t"$(printf '\t')" -k1,1 -k2,2r \
          | awk -F'\t' '!seen[$1]++ {print $1 "\t" $3}' \
          | while IFS="$(printf '\t')" read -r name id; do
              # Ordered by created_at and NOT by id. On 35027232682 the STALE
              # artifact is 10421606237 and the fresh one 10421359055 — the
              # stale id is the HIGHER of the two, so `max(id)` picks exactly
              # the wrong artifact. Do not "simplify" this to an id sort.
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
                > "${name}.zip"
              unzip -o -q "${name}.zip" -d results
              rm "${name}.zip"
            done
          ls -1 results

      - name: Combine and judge every row
        shell: bash
        run: |
          # The expected rows are the roster's, the same list the matrix ran.
          # Problems — a job that never reported, a row slower than the
          # envelope — render at the top of the job summary, every row below.
          python3 -m tools.benchmark.aggregate results \
            --summary "$GITHUB_STEP_SUMMARY" \
            --expect ${{ join(fromJSON(needs.roster.outputs.grammars), ' ') }}
