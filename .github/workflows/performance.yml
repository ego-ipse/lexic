name: performance regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/performance.yml"
      - "pyproject.toml"
      - "resources/**"
      - "src/**"
      - "tools/benchmark/**"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/performance.yml"
      - "pyproject.toml"
      - "resources/**"
      - "src/**"
      - "tools/benchmark/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lexic:
    name: Same-run Lexic A/B (${{ matrix.grammar }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_GIL: "0"
      LEXIC_REQUIRE_FREE_THREADED: "1"
    strategy:
      fail-fast: false
      matrix:
        # Static by design — a reader sees the whole matrix in the yaml. Must
        # match `BENCHES` in tools/benchmark/cases/grammars.py.
        grammar:
          - arithmetic
          - csv
          - json
          - gbnf-meta
          - abnf-meta
          - vyx
          - markdown
          - nested
          - lexruns
          - backtrack
          - mixedends
          - announced
    steps:
      - name: Check out HEAD
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          path: head

      - name: Resolve the comparison base
        id: base
        working-directory: head
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            sha="${{ github.event.before }}"
            if [[ "$sha" =~ ^0+$ ]]; then
              sha="$(git rev-parse HEAD^)"
            fi
          else
            sha="$(git rev-parse HEAD^)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out base
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base

      - name: Install free-threaded Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14t"

      - name: Install the locked development environment
        working-directory: head
        run: uv sync --locked --group dev

      - name: Require the free-threaded witness
        working-directory: head
        run: |
          uv run python -c "
          import sys
          assert not sys._is_gil_enabled(), 'performance workflow requires PYTHON_GIL=0'
          print('python:', sys.version.split()[0], 'gil enabled:', sys._is_gil_enabled())
          "

      - name: Install the corrected protocol into the base measurement copy
        working-directory: head
        run: |
          uv run python -m tools.benchmark.measurement.copy ../base

      - name: Compare base and HEAD on this runner
        working-directory: head
        run: |
          uv run python -u -m tools.benchmark.compare \
            --base-root ../base \
            --head-root . \
            --only ${{ matrix.grammar }} \
            --json ../ab-${{ matrix.grammar }}.json

      - name: Upload this grammar's result
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ab-${{ matrix.grammar }}
          path: ab-${{ matrix.grammar }}.json
          if-no-files-found: error

  aggregate:
    name: Aggregate results
    needs: lexic
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the aggregator
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: tools
          sparse-checkout-cone-mode: false

      - name: Download every grammar's result
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ab-*
          path: results
          merge-multiple: true

      - name: Combine and judge every row
        shell: bash
        run: |
          # The grammar list must match the matrix above. Problems — a job
          # that never reported, a row slower than the envelope — render at
          # the top of the job summary, every row below them.
          python3 -m tools.benchmark.aggregate results \
            --summary "$GITHUB_STEP_SUMMARY" \
            --expect arithmetic csv json gbnf-meta abnf-meta vyx \
                     markdown nested lexruns backtrack mixedends announced
