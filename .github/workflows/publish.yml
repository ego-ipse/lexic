name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Require a main commit and matching project version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - name: Install the locked development environment
        run: uv sync --locked --group dev
      - name: Run repository checks
        run: bash tools/run_checks.sh
      - name: Run examples
        run: bash tools/run_examples.sh
      - name: Run tests
        run: uv run python -m pytest
      - name: Build wheel and source distribution
        run: uv build
      - name: Check distribution metadata and README rendering
        run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Install and smoke-test the built wheel
        run: |
          uv venv --python 3.14 .release-smoke
          uv pip install --python .release-smoke/bin/python dist/*.whl
          .release-smoke/bin/python - <<'PY'
          from lexic import compile_text

          machine = compile_text('root ::= "reserved"\n')
          assert machine.parse("reserved").to_text() == "reserved"
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lexic
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
