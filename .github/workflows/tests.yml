name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    # Both witnesses run the SAME phases through the SAME script that is used
    # locally, so a green run here means what a green run on a laptop means.
    # The two differ in one variable only — the GIL — which is why the weak
    # witness toggles PYTHON_GIL on the free-threaded build rather than
    # installing a second interpreter that would differ in other ways too.
    name: ${{ matrix.witness }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - witness: free-threaded
            gil: "0"
            require_free_threaded: "1"
            require_gil: ""
          - witness: gil-weak-witness
            gil: "1"
            require_free_threaded: ""
            require_gil: "1"
    # Job level, not step level. A diagnostic that does not run in the same
    # environment as the thing it diagnoses reports the wrong answer with
    # total confidence — the first run of this workflow printed
    # "gil enabled: False" on the GIL leg for exactly that reason.
    env:
      PYTHON_GIL: ${{ matrix.gil }}
      # Each leg asserts its OWN identity. Without the second guard the matrix
      # can silently collapse into two identical runs, and a weak witness that
      # is secretly the strong one proves nothing twice.
      LEXIC_REQUIRE_FREE_THREADED: ${{ matrix.require_free_threaded }}
      LEXIC_REQUIRE_GIL: ${{ matrix.require_gil }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14t"
      - run: uv sync --group dev

      - name: Report the runner's parallelism
        run: |
          uv run python -c "
          import os, sys
          from lexic.parsing.parallel import available_workers
          print('python        :', sys.version.split()[0])
          print('gil enabled   :', sys._is_gil_enabled())
          print('os cpu count  :', os.cpu_count())
          print('available_workers():', available_workers())
          "

      - name: Tests — three phases
        run: bash tools/run_tests.sh
