[project]
name = "vyx-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "guidance==0.3.1",
    "lark>=1.3.1",
    "llama-cpp-python==0.3.20",
    "llguidance==1.5.0",
    "numpy>=2.4.4",
    "nvidia-ml-py>=13.595.45",
    "pydantic>=2.12.5",
    "pyparsing>=3.3.2",
    "rich>=14.3.3",
    "ruff>=0.15.9",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "built"]
