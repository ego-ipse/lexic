repos:
  - repo: local
    hooks:
      - id: lexic-checks
        name: Lexic checks
        entry: tools/run_checks.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: lexic-examples
        name: Lexic examples
        entry: tools/run_examples.sh
        language: system
        pass_filenames: false
        always_run: true
