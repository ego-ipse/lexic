repos:
  - repo: local
    hooks:
      # Structure only. A hook cannot reserve a quiet machine or establish
      # comparable hardware, so it enforces the row contracts and never runs a
      # hardware-specific absolute ratchet; the serial A/B owns acceptance.
      - id: lexic-benchmark-structure
        name: Lexic benchmark row-contract and structure gate
        entry: uv run python -m tools.benchmark.regression
        language: system
        pass_filenames: false
        always_run: true
      - id: lexic-checks
        name: Lexic checks
        entry: tools/run_checks.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: lexic-examples
        name: Lexic examples
        entry: tools/run_examples.sh
        language: system
        pass_filenames: false
        always_run: true
