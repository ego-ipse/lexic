<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>opsis — facets</title>
<link rel="stylesheet" href="/leaf.css">
</head>
<body>
<header id="mast">
  <span id="title">FACETS</span>
  <span id="sub">reading…</span>
  <span id="verdict"></span>
</header>
<main id="grid">
  <section id="grammar" class="facet">
    <h2>THE READER <em>grammar is the ground truth</em></h2>
    <div class="scroll" id="grammarScroll"><div id="grammarBody" class="code"></div></div>
  </section>
  <section id="document" class="facet">
    <h2>THE DOCUMENT <em>real text — select it</em></h2>
    <div class="scroll" id="docScroll">
      <div id="docWrap">
        <canvas id="under"></canvas>
        <div id="docBody" class="code"></div>
        <canvas id="over"></canvas>
      </div>
    </div>
  </section>
  <section id="chart" class="facet">
    <h2>THE DERIVATION <em>text is the time axis</em></h2>
    <canvas id="chartCv"></canvas>
  </section>
  <section id="spine" class="facet">
    <h2>THE SPINE <em>open at the cursor</em></h2>
    <div class="scroll"><div id="spineBody"></div><h3>JUST CLOSED</h3><div id="closedBody"></div></div>
  </section>
</main>
<footer id="status">
  <span id="pos"></span>
  <span id="hint">select text to co-select · double-click sets the cursor · E retypes the selection · Space plays · the chart scrubs</span>
  <span id="readout"></span>
</footer>
<div id="editbar" hidden>
  <label for="editInput">retype <span id="editSpan"></span> — Enter re-reads, Esc cancels</label>
  <input id="editInput" spellcheck="false" autocomplete="off">
</div>
<div id="banner" hidden></div>
<script src="/leaf.js"></script>
</body>
</html>
